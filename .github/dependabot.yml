version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: "06:30"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      frontend-production:
        dependency-type: production
        update-types:
          - patch
          - minor

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
      time: "06:45"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    groups:
      backend-production:
        dependency-type: production
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
