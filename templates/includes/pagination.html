{% if page_obj and page_obj.paginator.num_pages > 1 %}<nav class="pagination" aria-label="分頁">
  {% if page_obj.has_previous %}<a href="?{% if query %}q={{ query|urlencode }}&{% endif %}{% if selected_subcategory %}subcategory={{ selected_subcategory|urlencode }}&{% endif %}{% if selected_sort %}sort={{ selected_sort|urlencode }}&{% endif %}page={{ page_obj.previous_page_number }}" rel="prev">← 上一頁</a>{% endif %}
  <span>第 {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} 頁</span>
  {% if page_obj.has_next %}<a href="?{% if query %}q={{ query|urlencode }}&{% endif %}{% if selected_subcategory %}subcategory={{ selected_subcategory|urlencode }}&{% endif %}{% if selected_sort %}sort={{ selected_sort|urlencode }}&{% endif %}page={{ page_obj.next_page_number }}" rel="next">下一頁 →</a>{% endif %}
</nav>{% endif %}
