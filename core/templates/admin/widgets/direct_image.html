<div class="admin-image-manager admin-image-manager--single" data-admin-image-manager data-category="{{ widget.category }}"
 data-presign-url="{{ widget.presign_url }}" data-complete-url="{{ widget.complete_url }}"
 data-delete-url="{{ widget.delete_url }}" data-current-url="{{ widget.current_url }}" data-current-label="目前圖片"
 data-max-input-bytes="{{ widget.max_input_bytes }}" data-max-output-bytes="{{ widget.max_output_bytes }}"
 data-max-input-pixels="{{ widget.max_input_pixels }}" data-max-input-dimension="{{ widget.max_input_dimension }}"
 data-long-edge="{% if widget.profile == 'photo' %}{{ widget.photo_long_edge }}{% else %}{{ widget.artwork_long_edge }}{% endif %}">
  <input type="hidden" name="{{ widget.name }}" value="{{ widget.value|default_if_none:'' }}" data-image-value{% include "django/forms/widgets/attrs.html" %}>
  <label class="button admin-image-picker">選擇圖片<input type="file" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp" data-image-input></label>
  <div class="admin-image-message" data-image-message role="alert" hidden></div>
  <div class="admin-image-grid" data-image-grid aria-live="polite"></div>
  <p class="admin-image-empty" data-image-empty>尚未選擇圖片。</p>
  <p class="admin-image-help">支援 JPG、PNG、WebP。圖片會先在瀏覽器檢查及視需要縮小，再直接上傳至 Cloudflare R2。</p>
</div>
